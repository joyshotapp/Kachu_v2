[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kachu_plus"
version = "0.1.0"
description = "Kachu+ — SMB AI 商業夥伴，品牌陣地 + 顧客關係二合一"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.7.0",
  "httpx>=0.27.0",
  "sqlmodel>=0.0.22",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.14.0",
  "line-bot-sdk>=3.12.0",
  "litellm>=1.0.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
