    # ── plus.kachu.tw（Kachu+）─────────────────────────────────────────────────
    # 將此 server block 附加到 /opt/kachu-v2/infra/nginx/nginx.prod.conf 的最後，
    # 在 closing } 之前（http { ... } 內）。
    #
    # 需要先取得 SSL 憑證：
    #   docker exec kachu-v2-certbot-1 certbot certonly \
    #     --webroot --webroot-path=/var/www/certbot \
    #     -d plus.kachu.tw
    server {
        listen 443 ssl;
        http2 on;
        server_name plus.kachu.tw;

        ssl_certificate     /etc/letsencrypt/live/plus.kachu.tw/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/plus.kachu.tw/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Health check（no rate limit）
        location = /health {
            proxy_pass http://127.0.0.1:8002;
            access_log off;
        }

        # LINE / Google webhooks（higher rate limit）
        location /webhooks/ {
            limit_req zone=webhook_zone burst=100 nodelay;
            proxy_pass http://127.0.0.1:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 所有其他路由
        location / {
            limit_req zone=api_zone burst=30 nodelay;
            proxy_pass http://127.0.0.1:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }
